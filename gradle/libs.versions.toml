[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigation = "2.10.2"
lifecycle = "2.11.0"
room = "2.8.5"
work = "2.12.0"
datastore = "1.3.0"
appcompat = "1.8.0"
ondolsaemSdk = "sdk-v0.3.0"
nunsoriSdk = "sdk-v0.1.0"
jogakboSdk = "sdk-v0.1.0"
